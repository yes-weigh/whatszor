name: Production CI/CD

on:
  push:
    branches:
      - main

jobs:
  validate-and-build:
    name: Validate and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Security Audit
        run: pnpm audit --prod || true

      # Must run BEFORE typecheck — generates Prisma client types
      - name: Prisma Generate
        run: pnpm --filter api run db:generate

      # Must run BEFORE typecheck — builds @whatszor/shared dist/
      - name: Build Shared Packages
        run: pnpm --filter shared run build

      # Now safe to typecheck (Prisma types + shared types both available)
      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint || true

      - name: Build Web
        run: pnpm --filter web run build

      - name: Build API
        run: pnpm --filter api run build

      - name: Docker Compose Validate
        run: docker compose -f docker-compose.prod.yml config

  deploy:
    name: Deploy to VPS
    needs: validate-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Write env and deploy to Oracle Linux 9 VPS
        uses: appleboy/ssh-action@master
        env:
          VPS_ENV: ${{ secrets.VPS_ENV }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          envs: VPS_ENV
          script: |
            set -e

            # ── 1. Install Docker (if not present) ─────────────────────────────
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
              sudo dnf install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo systemctl enable --now docker
              sudo usermod -aG docker $USER
              echo "Docker installed. Note: Group changes may require a re-login or use of 'newgrp docker' in this session."
            fi

            # ── 1.5 Ensure swap space exists to prevent OOM ────────────────
            if [ -z "$(swapon --show)" ]; then
              echo "Creating 2GB swap file..."
              sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi

            # ── 2. Install Git (if not present) ────────────────────────────────
            if ! command -v git &> /dev/null; then
              sudo dnf install -y git
            fi

            # ── 3. Clone or pull the repository ────────────────────────────────
            PROJECT_DIR="$HOME/whatszor"
            if [ -d "$PROJECT_DIR/.git" ]; then
              echo "Repo exists — resetting to latest..."
              cd "$PROJECT_DIR"
              git fetch origin main
              git reset --hard origin/main
            else
              echo "Fresh server — cloning repo..."
              cd "$HOME"
              git clone https://github.com/yes-weigh/whatszor.git
              cd "$PROJECT_DIR"
            fi

            # ── 4. Write .env from the VPS_ENV secret (passed as envvar) ───────
            cd "$PROJECT_DIR"
            printf '%s\n' "$VPS_ENV" > .env
            echo ".env written ($(wc -l < .env) lines)"

            # ── 5. Build & start services ────────────────────────────────────────
            # Use 'sg docker' to ensure we have docker group permissions without logging out
            sg docker -c "
              docker compose -f docker-compose.prod.yml pull --ignore-pull-failures || true
              docker compose -f docker-compose.prod.yml run --rm api npx prisma migrate resolve --rolled-back 20260330100131_p3_p4_p8_impersonation_storage_session_lifecycle || true
              docker compose -f docker-compose.prod.yml run --rm api npx prisma migrate resolve --rolled-back 20260403034951_add_keyword_automations_and_insights || true
              docker compose -f docker-compose.prod.yml run --rm api npx prisma migrate resolve --rolled-back 20260403211729_add_lead_generation || true

              # ── 5.5 Migrate media from old volume name to new ────────────────────
              # api-uploads → api-media (one-time, safe to re-run)
              OLD_MEDIA=\$(docker volume ls -q | grep api-uploads || true)
              if [ -n \"\$OLD_MEDIA\" ]; then
                echo \"Migrating media files from api-uploads to api-media volume...\"
                docker run --rm \
                  -v whatszor_api-uploads:/src \
                  -v whatszor_api-media:/dst \
                  alpine sh -c 'cp -rn /src/. /dst/ 2>/dev/null; echo \"Media migration done\"'
              fi

              if ! docker compose -f docker-compose.prod.yml up -d --build --force-recreate; then
                echo '❌ docker compose up failed! Fetching logs...'
                docker compose -f docker-compose.prod.yml logs api worker || true
                exit 1
              fi

              # ── 6. Restart Caddy ─────────────────────────────────────────────────────────
              docker compose -f docker-compose.prod.yml stop caddy
              docker compose -f docker-compose.prod.yml up -d caddy
              echo 'Caddy restarted'

              # ── 7. Show running containers ───────────────────────────────────────
              docker compose -f docker-compose.prod.yml ps

              # ── 8. Prune old images ──────────────────────────────────────────────
              docker system prune -f
            "
            echo "✅ Deployment complete!"
