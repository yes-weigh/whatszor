name: Production CI/CD

on:
  push:
    branches:
      - main

jobs:
  validate-and-build:
    name: Validate and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Security Audit
        run: pnpm audit --prod || true

      # Must run BEFORE typecheck — generates Prisma client types
      - name: Prisma Generate
        run: pnpm --filter api run db:generate

      # Must run BEFORE typecheck — builds @whatszor/shared dist/
      - name: Build Shared Packages
        run: pnpm --filter shared run build

      # Now safe to typecheck (Prisma types + shared types both available)
      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint || true

      - name: Build Web
        run: pnpm --filter web run build

      - name: Build API
        run: pnpm --filter api run build

      - name: Docker Compose Validate
        run: docker compose -f docker-compose.prod.yml config

  deploy:
    name: Deploy to VPS
    needs: validate-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Write env and deploy to Hostinger VPS
        uses: appleboy/ssh-action@master
        env:
          VPS_ENV: ${{ secrets.VPS_ENV }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          envs: VPS_ENV
          script: |
            set -e

            # ── 1. Install Docker (if not present) ─────────────────────────────
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              curl -fsSL https://get.docker.com | sh
              systemctl enable docker
              systemctl start docker
            fi

            # ── 1.5 Ensure swap space exists to prevent OOM ────────────────
            if [ -z "$(swapon --show)" ]; then
              echo "Creating 2GB swap file..."
              fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
              chmod 600 /swapfile
              mkswap /swapfile
              swapon /swapfile
              echo '/swapfile none swap sw 0 0' >> /etc/fstab
            fi

            # ── 2. Install Git (if not present) ────────────────────────────────
            if ! command -v git &> /dev/null; then
              apt-get update -qq && apt-get install -y git
            fi

            # ── 3. Clone or pull the repository ────────────────────────────────
            if [ -d /root/whatszor/.git ]; then
              echo "Repo exists — resetting to latest..."
              cd /root/whatszor
              git fetch origin main
              git reset --hard origin/main
            else
              echo "Fresh server — cloning repo..."
              cd /root
              git clone https://github.com/yes-weigh/whatszor.git
              cd /root/whatszor
            fi

            # ── 4. Write .env from the VPS_ENV secret (passed as envvar) ───────
            cd /root/whatszor
            printf '%s\n' "$VPS_ENV" > .env
            echo ".env written ($(wc -l < .env) lines)"

            # ── 5. Build & start services ────────────────────────────────────────
            docker compose -f docker-compose.prod.yml pull --ignore-pull-failures || true
            docker compose -f docker-compose.prod.yml up -d --build --force-recreate

            # ── 6. Run DB migrations ─────────────────────────────────────────────
            echo "Waiting for API to be ready..."
            sleep 30
            docker compose -f docker-compose.prod.yml exec -T api npx prisma migrate deploy

            # ── 7. Restart Caddy ─────────────────────────────────────────────────────────
            docker compose -f docker-compose.prod.yml stop caddy
            # docker run --rm -v whatszor_caddy-config:/config alpine sh -c "rm -rf /config/*" || true
            docker compose -f docker-compose.prod.yml up -d caddy
            echo "Caddy restarted (TLS state preserved)"

            # ── 8. Show running containers ───────────────────────────────────────
            docker compose -f docker-compose.prod.yml ps

            # ── 8. Prune old images ──────────────────────────────────────────────
            docker system prune -f
            echo "✅ Deployment complete!"
